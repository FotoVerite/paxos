{% import "macros/nav.html" as nav %}
<!-- PMC Navigation Bar -->
<link rel="stylesheet" href="/css/papers/paxos_made_moderately_complex/nav.css">

<nav class="pmc-navbar">
    <div class="nav-container">
        <div class="nav-brand">
            <a href="{{ nav::site_url(raw_url="/") }}" class="brand-link">
                <span class="brand-text pmc-brand">Paxos Made Moderately Complex</span>
            </a>
        </div>
        
        <button class="hamburger-menu" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <div class="nav-menu" id="navMenu">
            <div class="nav-item">
                <a href="{{ nav::site_url(raw_url="/") }}" class="nav-link">Home</a>
            </div>
            <div class="nav-item">
                <a href="{{ nav::site_url(raw_url="/introduction") }}" class="nav-link">Introduction</a>
            </div>
            <div class="nav-item">
                <a href="{{ nav::site_url(raw_url="/how-and-why") }}" class="nav-link">How & Why</a>
            </div>
            <div class="nav-item">
                <a href="{{ nav::site_url(raw_url="/liveness") }}" class="nav-link">Liveness</a>
            </div>
            <div class="nav-item">
                <a href="{{ nav::site_url(raw_url="/practical") }}" class="nav-link">Practical</a>
            </div>
        </div>
    </div>
</nav>

<script>
    const hamburger = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');
    
    hamburger.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        hamburger.classList.toggle('active');
    });

    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
            navMenu.classList.remove('active');
            hamburger.classList.remove('active');
        });
    });
</script>
