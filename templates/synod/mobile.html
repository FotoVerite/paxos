<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Synod</title>
    <link rel="stylesheet" href="/css/synod.css">
    <script src="/js/synod-mobile.js" defer></script>
  </head>
  <body class="synod-page synod-mobile">
    <main class="phone-shell">
      <section class="panel hero-panel">
        <div>
          <p class="eyebrow">synod / main</p>
          <h1 id="clientName">Joining...</h1>
          <p class="node-line" id="nodeLine" hidden>room assignment pending</p>
        </div>
        <div class="badge" id="clientBadge">--</div>
      </section>

      <section class="panel machine-panel">
        <div class="machine-header">
          <div class="machine-stats">
            <span>slot <strong id="clusterSlot">0</strong></span>
            <span>applied <strong id="lastApplied">0</strong></span>
            <span>nodes <strong id="activeNodes">0</strong></span>
          </div>
          <span class="machine-pool" id="poolSize">0 in pool</span>
        </div>
        <div class="dice-stage" aria-live="polite">
          <div class="cube" id="emojiCube">
            <div class="face face-front">🦀</div>
            <div class="face face-back">📦</div>
            <div class="face face-right">🔒</div>
            <div class="face face-left">🧵</div>
            <div class="face face-top">⚙️</div>
            <div class="face face-bottom">🧪</div>
          </div>
        </div>
        <button class="submit-button" id="submitButton" type="button" data-face="⚄">
          <span class="submit-button-text">roll dice</span>
        </button>
        <p class="status-line" id="statusLine">Waiting for room assignment.</p>
        <div class="roll-rail is-empty" id="rollRail" aria-label="Recent roll ordering">
          <div class="roll-rail-head">
            <span>roll order</span>
            <strong id="rollRailSummary">no local rolls</strong>
          </div>
          <div class="roll-track" id="rollTrack"></div>
          <div class="roll-viewer" id="rollViewer" hidden>
            <div class="roll-viewer-focus" id="rollViewerFocus"></div>
            <div class="roll-viewer-table" id="rollViewerTable"></div>
          </div>
        </div>
      </section>

      <section class="stream-panel heat-shell">
        <div class="stream-stage" id="streamStage"></div>
      </section>
    </main>
  </body>
</html>
