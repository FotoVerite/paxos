          <a href="{{ nav::site_url(raw_url="/overview-vertical-paxos/basics") }}" class="nav-link nav-sublink">Basics</a>
          <a href="{{ nav::site_url(raw_url="/overview-vertical-paxos/quorum") }}" class="nav-link nav-sublink">Quorum</a>

          <span class="nav-group-text">Primary Backup Case</span>

        </button>
        <div class="nav-submenu" id="primary-backup-case-menu">
          <a href="{{ nav::site_url(raw_url="/primary-backup-case/quorums-and-leaders") }}" class="nav-link nav-sublink">Quorum and Leadership</a>

</nav>

<script>
  const hamburger = document.getElementById('hamburgerBtn');
  const navMenu = document.getElementById('navMenu');
  const vpNavbar = document.querySelector('.vp-navbar');
  const navGroupToggles = document.querySelectorAll('.nav-group-toggle');
  const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
  const closeAllSubmenus = () => {
    document.querySelectorAll('.nav-submenu.active').forEach((menu) => {
      menu.classList.remove('active');
    });
    document.querySelectorAll('.nav-group-toggle.active').forEach((toggle) => {
      toggle.classList.remove('active');
    });
  };

  if (hamburger && navMenu) {
    hamburger.addEventListener('click', () => {
      navMenu.classList.toggle('active');
      hamburger.classList.toggle('active');
    });
  }

  document.querySelectorAll('.nav-sublink, .nav-item .nav-link').forEach((link) => {
    const linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/+$/, '') || '/';
    if (linkPath === currentPath) {
      link.classList.add('active');

      const submenu = link.closest('.nav-submenu');
      if (submenu) {
        const toggle = submenu.parentElement?.querySelector('.nav-group-toggle');
        if (toggle) toggle.classList.add('is-current');
      }
    }
  });

  navGroupToggles.forEach((toggle) => {
    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      const group = toggle.dataset.group;
      const submenu = document.getElementById(`${group}-menu`);
      if (!submenu) return;

      const isActive = submenu.classList.contains('active');

      document.querySelectorAll('.nav-submenu.active').forEach((menu) => {
        if (menu !== submenu) {
          menu.classList.remove('active');
          menu.parentElement?.querySelector('.nav-group-toggle')?.classList.remove('active');
        }
      });

      submenu.classList.toggle('active', !isActive);
      toggle.classList.toggle('active', !isActive);
    });
  });

  document.querySelectorAll('.nav-link').forEach((link) => {
    link.addEventListener('click', () => {
      closeAllSubmenus();
      if (!navMenu || !hamburger) return;
      navMenu.classList.remove('active');
      hamburger.classList.remove('active');
    });
  });

  document.addEventListener('click', (event) => {
    if (!vpNavbar || vpNavbar.contains(event.target)) return;
    closeAllSubmenus();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    closeAllSubmenus();
    if (!navMenu || !hamburger) return;
    navMenu.classList.remove('active');
    hamburger.classList.remove('active');
  });
</script>
