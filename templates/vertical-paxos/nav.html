{% import "macros/nav.html" as nav %}
<link rel="stylesheet" href="/css/papers/vertical_paxos/nav.css" />

<nav class="vp-navbar">
  <div class="vp-nav-shell">
    <a href="{{ nav::site_url(raw_url="/") }}" class="vp-brand">
      <img
        src="/svgs/vertical/atlas-mark.svg"
        alt=""
        aria-hidden="true"
        class="vp-brand-mark"
      />
      <span class="vp-brand-copy">
        <span class="vp-brand-kicker">Atlas Plate I</span>

    <button class="vp-nav-toggle" id="vpNavToggle" type="button" aria-label="Toggle navigation">

  </div>

<script>
  const vpNavToggle = document.getElementById('vpNavToggle');
  const vpNavLinks = document.getElementById('vpNavLinks');

  if (vpNavToggle && vpNavLinks) {
    vpNavToggle.addEventListener('click', () => {
      vpNavLinks.classList.toggle('active');
      vpNavToggle.classList.toggle('active');
    });
  }
</script>
