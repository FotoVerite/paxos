{% macro breadcrumb(prev_url, prev_label, current_label, next_url, next_label) %}
<div class="breadcrumb-nav">
    {% if prev_url %}
    <a href="{{ prev_url }}" class="breadcrumb-link breadcrumb-prev" title="Go to previous page">
        <span class="breadcrumb-arrow">←</span>
        <span class="breadcrumb-text">{{ prev_label }}</span>
    </a>
    {% endif %}

    <div class="breadcrumb-current">
        <span class="breadcrumb-label">{{ current_label }}</span>
    </div>

    {% if next_url %}
    <a href="{{ next_url }}" class="breadcrumb-link breadcrumb-next" title="Go to next page">
        <span class="breadcrumb-text">{{ next_label }}</span>
        <span class="breadcrumb-arrow">→</span>
    </a>
    {% endif %}
</div>
{% endmacro breadcrumb %}
