<!-- Reusable Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-brand">
            <a href="/">⚡ Paxos</a>
        </div>
        <div class="nav-menu">
            <a href="/" class="nav-link">Visualizer</a>
            <a href="/senate" class="nav-link">Senate</a>
            <a href="/decree" class="nav-link">Decree Lifecycle</a>
        </div>
    </div>
</nav>

<style>
    .navbar {
        background: #1e293b;
        border-bottom: 1px solid #334155;
        padding: 0;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .nav-container {
        max-width: 100%;
        margin: 0;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
    }

    .nav-brand a {
        font-size: 1.3rem;
        font-weight: bold;
        color: #60a5fa;
        text-decoration: none;
        transition: color 0.2s;
    }

    .nav-brand a:hover {
        color: #3b82f6;
    }

    .nav-menu {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .nav-link {
        color: #cbd5e1;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .nav-link:hover {
        background: #334155;
        color: #60a5fa;
    }

    .nav-link.active {
        background: #334155;
        color: #60a5fa;
    }
</style>

<script>
    // Highlight current page
    document.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === path || 
                (path === '/' && link.getAttribute('href') === '/')) {
                link.classList.add('active');
            }
        });
    });
</script>
