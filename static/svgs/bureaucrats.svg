<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF71CE" />
      <stop offset="100%" stop-color="#01CDFE" />
    </linearGradient>
    
    <circle id="dot" r="1.5" fill="url(#lineGrad)" opacity="0.7" />
  </defs>

  <g transform="translate(50, 50) scale(1.3)">
    <rect x="-35" y="-30" width="70" height="60" rx="2" stroke="url(#lineGrad)" stroke-width="3" />

    <path d="M-35 -10 H35 M-35 10 H35 M-11.6 -30 V30 M11.6 -30 V30" 
      stroke="url(#lineGrad)" stroke-width="1.2" stroke-opacity="0.3" />

    <g transform="translate(-23, -20)">
      <use href="#dot" x="0" y="-3"/>
      <use href="#dot" x="-3" y="3"/>
      <use href="#dot" x="3" y="3"/>
    </g>

    <g transform="translate(0, -20)">
      <use href="#dot" x="0" y="0"/>
      <use href="#dot" x="-4" y="0"/>
      <use href="#dot" x="4" y="0"/>
      <use href="#dot" x="-2" y="-4"/>
      <use href="#dot" x="2" y="-4"/>
      <use href="#dot" x="-2" y="4"/>
      <use href="#dot" x="2" y="4"/>
    </g>

    <g transform="translate(0, 20)">
      <use href="#dot" x="0" y="0"/>
      <use href="#dot" x="-3.5" y="-3.5"/>
      <use href="#dot" x="3.5" y="-3.5"/>
      <use href="#dot" x="-3.5" y="3.5"/>
      <use href="#dot" x="3.5" y="3.5"/>
    </g>

    <g transform="translate(-23, 0)">
      <use href="#dot" x="0" y="0"/>
      <use href="#dot" x="-3.5" y="-3.5"/>
      <use href="#dot" x="3.5" y="-3.5"/>
      <use href="#dot" x="-3.5" y="3.5"/>
      <use href="#dot" x="3.5" y="3.5"/>
    </g>

    <g transform="translate(0, 0)">
      <use href="#dot" x="0" y="-3"/>
      <use href="#dot" x="-3" y="3"/>
      <use href="#dot" x="3" y="3"/>
    </g>

    <g transform="translate(23, 0)">
      <use href="#dot" x="0" y="0"/><use href="#dot" x="-4" y="0"/><use href="#dot" x="4" y="0"/>
      <use href="#dot" x="-2" y="-4"/><use href="#dot" x="2" y="-4"/><use href="#dot" x="-2" y="4"/><use href="#dot" x="2" y="4"/>
    </g>

    <path d="M-20 -36 H20" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>