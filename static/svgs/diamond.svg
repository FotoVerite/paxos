<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="livenessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF71CE" />
      <stop offset="100%" stop-color="#01CDFE" />
    </linearGradient>
  </defs>

  <!-- Center source -->
  <circle cx="50" cy="50" r="4" fill="url(#livenessGrad)" />

  <!-- Expanding ripples showing propagation over time -->
  <!-- First ripple (closest/fastest) -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="url(#livenessGrad)" stroke-width="2" opacity="0.9" />

  <!-- Second ripple (mid-distance) -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="url(#livenessGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Third ripple (farthest) -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#livenessGrad)" stroke-width="1" opacity="0.3" />

  <!-- Nodes receiving the propagation (at cardinal directions) -->
  <!-- Top -->
  <circle cx="50" cy="22" r="3" fill="url(#livenessGrad)" opacity="0.7" />
  <!-- Right -->
  <circle cx="78" cy="50" r="3" fill="url(#livenessGrad)" opacity="0.7" />
  <!-- Bottom -->
  <circle cx="50" cy="78" r="3" fill="url(#livenessGrad)" opacity="0.7" />
  <!-- Left -->
  <circle cx="22" cy="50" r="3" fill="url(#livenessGrad)" opacity="0.7" />

</svg>
