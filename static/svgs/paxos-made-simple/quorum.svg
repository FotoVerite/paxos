<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="horizontalHatch" width="100" height="2.5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF41" stroke-width="0.7" />
    </pattern>

    <pattern id="dotMatrix" width="2" height="2" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00FF41" />
    </pattern>

    <mask id="ringMask">
      <circle cx="60" cy="50" r="22" fill="white" />
      <circle cx="60" cy="50" r="17" fill="black" />
    </mask>

    <clipPath id="lensClip">
      <circle cx="60" cy="50" r="22" />
    </clipPath>
  </defs>

  <circle cx="40" cy="50" r="22" 
          fill="none" 
          stroke="#00FF41" 
          stroke-width="1" 
          opacity="0.3" />

  <circle cx="60" cy="50" r="22" fill="none" stroke="#00FF41" stroke-width="1" />
  <circle cx="60" cy="50" r="17" fill="none" stroke="#00FF41" stroke-width="1" />
  <rect x="38" y="28" width="44" height="44" 
        fill="url(#horizontalHatch)" 
        mask="url(#ringMask)" />

  <circle cx="40" cy="50" r="22" 
          fill="url(#dotMatrix)" 
          clip-path="url(#lensClip)" />
</svg>