<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="horizontalHatch" width="100" height="0.8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF41" stroke-width="0.3"/>
    </pattern>
    <pattern id="dotMatrix" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
      <circle cx="0.6" cy="0.6" r="0.4" fill="#00FF41"/>
    </pattern>

    <clipPath id="agentClip">
      <path d="M 50 20 L 80 50 L 50 80 L 20 50 Z" />
    </clipPath>
  </defs>

  <path d="M 50 15 L 85 50 L 50 85 L 15 50 Z" 
        fill="none" stroke="#00FF41" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.3" />

  <path d="M 50 20 L 20 50 L 50 80" fill="none" stroke="#00FF41" stroke-width="1.5" stroke-dasharray="3 1" />
  
  <path d="M 50 20 L 80 50 L 50 80" fill="url(#horizontalHatch)" stroke="#00FF41" stroke-width="1" />

  <rect x="40" y="40" width="20" height="20" 
        transform="rotate(45 50 50)"
        fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="1" />

  <line x1="50" y1="20" x2="50" y2="10" stroke="#00FF41" stroke-width="1" />
  <line x1="50" y1="80" x2="50" y2="90" stroke="#00FF41" stroke-width="1" />
  <circle cx="50" cy="10" r="1" fill="#00FF41" />
  <circle cx="50" cy="90" r="1" fill="#00FF41" />
</svg>