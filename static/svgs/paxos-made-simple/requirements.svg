<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="horizontalHatch" width="100" height="0.8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF41" stroke-width="0.3" />
    </pattern>
    <pattern id="dotMatrix" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#00FF41" />
    </pattern>
  </defs>

  <g>


    <circle cx="22" cy="26" r="3" fill="none" stroke="#00FF41" stroke-width="1" stroke-dasharray="1 1" opacity="0.5" />
    <rect x="30" y="25" width="40" height="3" rx="1" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-dasharray="2 1" opacity="0.4" />

    <circle cx="22" cy="50" r="3" fill="url(#horizontalHatch)" stroke="#00FF41" stroke-width="1" />
    <rect x="30" y="48" width="45" height="4" rx="2" fill="url(#horizontalHatch)" stroke="#00FF41" stroke-width="0.5" />

    <circle cx="22" cy="75" r="4" fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="0.5" />
    <rect x="30" y="72" width="50" height="7" rx="2" fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="1" />
  </g>
</svg>