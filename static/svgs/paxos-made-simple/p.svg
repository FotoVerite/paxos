<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="horizontalHatch" width="100" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF41" stroke-width="0.3"/>
    </pattern>
    <pattern id="dotMatrix" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
      <circle cx="0.2" cy="0.2" r="0.4" fill="#00FF41"/>
    </pattern>
    
    <mask id="splitMask">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <rect x="48" y="20" width="4" height="60" fill="black"/>
      <circle cx="50" cy="50" r="12" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#splitMask)">
    <path d="M 45 25 L 15 50 L 45 75 Z" fill="none" stroke="#00FF41" stroke-width="2" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M 38 32 L 20 50 L 38 68" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.4" />
  </g>

  <g mask="url(#splitMask)">
    <path d="M 55 25 L 85 50 L 55 75 Z" fill="url(#horizontalHatch)" stroke="#00FF41" stroke-width="1" />
  </g>

  <circle cx="50" cy="50" r="9" fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="1" />
  
  <path d="M 50 15 L 90 35 L 90 65 L 50 85 L 10 65 L 10 35 Z" 
        fill="none" stroke="#00FF41" stroke-width="0.5" opacity="0.3" />


</svg>