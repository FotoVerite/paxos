<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="horizontalHatch" width="100" height="0.8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF41" stroke-width="0.3"/>
    </pattern>
    <pattern id="dotMatrix" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
      <circle cx="0.6" cy="0.6" r="0.4" fill="#00FF41"/>
    </pattern>
    
    <g id="beacon">
      <circle cx="0" cy="0" r="4" fill="url(#dotMatrix)"/>
      <circle cx="0" cy="0" r="7" stroke="#00FF41" stroke-width="1" fill="none" stroke-dasharray="2 1" opacity="0.4"/>
      <circle cx="0" cy="0" r="10" stroke="#00FF41" stroke-width="1" fill="none" stroke-dasharray="2 1" opacity="0.2"/>
    </g>
  </defs>

  <g transform="translate(70, 0)">
    <rect x="0" y="85" width="20" height="5" fill="url(#horizontalHatch)" stroke="#00FF41" stroke-width="0.5" />
    
    <rect x="2" y="65" width="16" height="20" fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="1" />
    <rect x="2" y="45" width="16" height="18" fill="url(#dotMatrix)" stroke="#00FF41" stroke-width="1" opacity="0.8" />
    
    <rect x="2" y="25" width="16" height="18" fill="none" stroke="#00FF41" stroke-width="1" stroke-dasharray="3 2" opacity="0.4" />
    
  </g>

  <use href="#beacon" x="15" y="80" opacity="0.4" />
  
  <use href="#beacon" x="35" y="65" opacity="0.7" />
  
  <g transform="translate(55, 45)">
    <use href="#beacon" x="0" y="0" />
    <line x1="8" y1="0" x2="16" y2="0" stroke="#00FF41" stroke-width="1" stroke-dasharray="2 1" />
  </g>

  <path d="M 15 80 Q 35 75 50 45" fill="none" stroke="#00FF41" stroke-width="0.3" stroke-dasharray="1 3" opacity="0.3" />

</svg>