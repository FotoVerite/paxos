<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="interlockGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="10" y1="50" x2="90" y2="50" stroke="#4A4E52" stroke-width="1.5" stroke-dasharray="2 2" />

  <g transform="translate(50, 50)">
    <path d="M-8 -14 L8 -14 L14 0 L8 14 L-8 14 L-14 0 Z" fill="#1A1A1B" stroke="#FFB100" stroke-width="2" filter="url(#interlockGlow)" />
    
    <path d="M-3 -6 C1 -6 4 -4 0 -1 C4 2 1 6 -3 6 M-1 -1 L2 2" fill="none" stroke="#FFB100" stroke-width="1.5" stroke-linecap="round" />
    
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFB100" stroke-width="0.5" opacity="0.3">
      <animate attributeName="r" from="14" to="20" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(25, 50)">
    <path d="M10 0 L-10 0" stroke="#FFB100" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="0" y="-8" font-family="IBM Plex Mono" font-size="6" fill="#FFB100" text-anchor="middle">S1</text>
    <rect x="-14" y="-3" width="6" height="6" fill="none" stroke="#E74C3C" stroke-width="1" />
  </g>

  <g transform="translate(75, 50)">
    <path d="M-10 0 L10 0" stroke="#FFB100" stroke-width="1.5" />
    <text x="0" y="-8" font-family="IBM Plex Mono" font-size="6" fill="#FFB100" text-anchor="middle">S2</text>
    <circle cx="12" cy="0" r="2" fill="#72787E" />
    <circle cx="18" cy="0" r="2" fill="#72787E" />
  </g>

</svg>