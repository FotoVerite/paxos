<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <defs>
    <filter id="alphaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="10" y1="50" x2="90" y2="50" stroke="#4A4E52" stroke-width="1.5" stroke-dasharray="2 2"/>

  <g transform="translate(20, 50)">
    <rect x="-4" y="-4" width="8" height="8" fill="#1A1A1B" stroke="#72787E" stroke-width="1.5"/>
  </g>

  <g transform="translate(24, 46)">
    <path d="M4 0 L4 8 M4 4 L48 4 M48 0 L48 8" fill="none" stroke="#FFB100" stroke-width="1" opacity="0.6"/>
    <circle cx="15" cy="4" r="1.5" fill="#FFB100">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="26" cy="4" r="1.5" fill="#FFB100">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="37" cy="4" r="1.5" fill="#FFB100">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <g transform="translate(75, 50)">
    <circle r="9" fill="#1A1A1B" stroke="#FFB100" stroke-width="1.5" filter="url(#alphaGlow)"/>
    
    <g transform="translate(0.5, 1)">
       <path d="M 4,-4 
                L -1.5,1.5 
                C -4.5,4.5 -7,0 -4.5,-4.5 
                C -3,-6 0,-3 1.5,-1.5 
                L 4,1" 
             fill="none" 
             stroke="#FFB100" 
             stroke-width="1.6" 
             stroke-linecap="round" 
             stroke-linejoin="round"/>
    </g>

    <circle r="9" fill="none" stroke="#FFB100" stroke-width="0.5">
      <animate attributeName="r" from="9" to="18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>