<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <defs>
    <filter id="wallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="10" y1="50" x2="45" y2="50" stroke="#FFB100" stroke-width="3" filter="url(#wallGlow)" />
  <circle cx="15" cy="50" r="2" fill="#FFB100" />
  <circle cx="28" cy="50" r="2" fill="#FFB100" />

  <g transform="translate(45, 50)">
    <rect x="-6" y="-6" width="12" height="12" fill="#1A1A1B" stroke="#FFB100" stroke-width="2" filter="url(#wallGlow)" />
    <path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke="#FFB100" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <g transform="translate(56, 50)">
    <rect x="0" y="-20" width="6" height="40" fill="#72787E" />
    <line x1="0" y1="-12" x2="6" y2="-12" stroke="#1A1A1B" stroke-width="1" />
    <line x1="0" y1="0" x2="6" y2="0" stroke="#1A1A1B" stroke-width="1" />
    <line x1="0" y1="12" x2="6" y2="12" stroke="#1A1A1B" stroke-width="1" />
    
    <rect x="6" y="-20" width="2" height="40" fill="#4A4E52" />
  </g>

  <g opacity="0.2">
     <line x1="65" y1="50" x2="90" y2="50" stroke="#4A4E52" stroke-width="1" stroke-dasharray="1 5" />
  </g>

  <path d="M10 25 V75 M90 25 V75" stroke="#4A4E52" stroke-width="0.5" opacity="0.3" />
</svg>