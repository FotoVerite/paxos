<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <defs>
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <path d="M15 35 L50 35" stroke="#4A4E52" stroke-width="4" stroke-linecap="butt" />
    <rect x="50" y="30" width="4" height="10" fill="#72787E" />
  </g>

  <path d="M52 35 V65" stroke="#FFB100" stroke-width="2" stroke-dasharray="4 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="6" to="0" dur="1s" repeatCount="indefinite" />
  </path>

  <g filter="url(#amberGlow)">
    <circle cx="52" cy="65" r="5" fill="#FFB100" />
    <path d="M52 65 L85 65" stroke="#FFB100" stroke-width="5" stroke-linecap="round" />
  </g>

  <circle cx="52" cy="65" r="5" fill="none" stroke="#FFB100" stroke-width="1">
    <animate attributeName="r" from="5" to="15" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <path d="M10 20 V80 M90 20 V80" stroke="#4A4E52" stroke-width="1" opacity="0.2" />
</svg>