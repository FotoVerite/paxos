<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <defs>
    <filter id="stopGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="10" y1="50" x2="90" y2="50" stroke="#4A4E52" stroke-width="2" stroke-dasharray="2 2" />

  <g transform="translate(20, 50)">
    <rect x="-5" y="-5" width="10" height="10" fill="#1A1A1B" stroke="#72787E" stroke-width="1.5" />
    <circle r="2" fill="#72787E" />
  </g>

  <rect x="25" y="45" width="40" height="10" fill="#FFB100" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite" />
  </rect>
  <line x1="25" y1="50" x2="65" y2="50" stroke="#FFB100" stroke-width="2" />

  <g transform="translate(70, 50)">
    <rect x="-2" y="-15" width="4" height="30" fill="#E74C3C" filter="url(#stopGlow)" />
    
    <path d="M-6 -10 L6 -10 L10 -6 L10 6 L6 10 L-6 10 L-10 6 L-10 -6 Z" 
          fill="none" stroke="#E74C3C" stroke-width="1" opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" />
    </path>
  </g>

  <line x1="72" y1="50" x2="90" y2="50" stroke="#4A4E52" stroke-width="1" stroke-dasharray="1 3" />

  <circle r="3" fill="#FFB100">
    <animateMotion path="M 20 50 L 70 50" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>