<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="padGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="fadeAway" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#72787E; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#72787E; stop-opacity:0" />
    </linearGradient>
  </defs>

  <line x1="10" y1="50" x2="35" y2="50" stroke="#FFB100" stroke-width="3" filter="url(#padGlow)" />
  <circle cx="15" cy="50" r="2" fill="#FFB100" />
  <circle cx="28" cy="50" r="2" fill="#FFB100" />

<g transform="translate(41, 45) scale(0.3)">
    <path d="M0 0 L25 15 L0 30 Z" fill="#1A1A1B" stroke="#72787E" stroke-width="2" />
    <line x1="25" y1="15" x2="32" y2="15" stroke="#72787E" stroke-width="2" />
  </g>

  <g transform="translate(55, 50)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="url(#fadeAway)" stroke-width="1.5" stroke-dasharray="2 2" />
    
    <circle cx="8" cy="0" r="3" fill="none" stroke="#72787E" stroke-width="1" opacity="0.8" />
    <circle cx="20" cy="0" r="3" fill="none" stroke="#72787E" stroke-width="1" opacity="0.5" />
    <circle cx="32" cy="0" r="3" fill="none" stroke="#72787E" stroke-width="1" opacity="0.2" />
  </g>

  <path d="M10 25 V75 M90 25 V75" stroke="#4A4E52" stroke-width="0.5" opacity="0.3" />
</svg>