<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <defs>
    <filter id="junctionGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M10 50 L40 50" stroke="#4A4E52" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 4" />

  <path d="M50 50 L90 30" stroke="#72787E" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <path d="M50 50 L90 70" stroke="#FFB100" stroke-width="4" stroke-linecap="round" filter="url(#junctionGlow)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>

  <g transform="translate(50, 50)">
    <circle r="12" fill="#1A1A1B" stroke="#72787E" stroke-width="1.5" />
    
    <line x1="0" y1="0" x2="8" y2="3.9" stroke="#FFB100" stroke-width="3" stroke-linecap="round" />
    
    <circle r="3" fill="#FFB100" filter="url(#junctionGlow)" />
    
    <circle r="3" fill="none" stroke="#FFB100" stroke-width="1">
      <animate attributeName="r" from="3" to="15" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>