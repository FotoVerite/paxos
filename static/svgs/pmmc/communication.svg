<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="nodeHatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="white" stroke-width="0.5" />
    </pattern>
    
    <g id="beacon-node">
      <circle cx="0" cy="0" r="6" fill="url(#nodeHatch)" stroke="white" stroke-width="1.5" />
      <path d="M -8 0 H 8 M 0 -8 V 8" stroke="white" stroke-width="0.5" opacity="0.4" />
    </g>
  </defs>

  <g transform="translate(15, 50)">
    <circle cx="0" cy="0" r="3" fill="white" />
    <path d="M 12 -15 Q 25 0 12 15" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="2,1" />
  </g>

  <g stroke="white" stroke-width="1" stroke-dasharray="4,2" opacity="0.6">
    <line x1="18" y1="50" x2="75" y2="25" />
    <line x1="18" y1="50" x2="80" y2="50" />
    <line x1="18" y1="50" x2="75" y2="75" />
  </g>

  <use href="#beacon-node" x="75" y="25" />
  <use href="#beacon-node" x="82" y="50" />
  <use href="#beacon-node" x="75" y="75" />

  <path d="M 45 42 H 55 L 50 50 L 55 58 H 45" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round" />
</svg>