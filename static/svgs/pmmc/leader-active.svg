    </circle>
  </g>

  <path d="M 35 90 H 65" stroke="#ffcc00" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 94 H 60" stroke="#ffcc00" stroke-width="1" opacity="0.5" />
