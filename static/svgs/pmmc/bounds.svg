<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffcc00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g stroke="#ffcc00" stroke-width="2" stroke-linecap="round">
    <line x1="15" y1="25" x2="85" y2="25" />
    <line x1="15" y1="75" x2="85" y2="75" />
    <line x1="15" y1="22" x2="15" y2="28" stroke-width="1" />
    <line x1="85" y1="22" x2="85" y2="28" stroke-width="1" />
    <line x1="15" y1="72" x2="15" y2="78" stroke-width="1" />
    <line x1="85" y1="72" x2="85" y2="78" stroke-width="1" />
  </g>

  <rect x="15" y="25" width="70" height="50" fill="url(#boundGradient)" />

  <g transform="translate(25, 45)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="0" x2="0" y2="-7" stroke="white" stroke-width="1.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="3" y2="-6" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="10" dur="2s" repeatCount="indefinite" />
    </line>
  </g>

  <path d="M 45 60 C 55 45, 65 65, 75 50" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="3s" repeatCount="indefinite" />
  </path>
  
  <g transform="translate(75, 50)">
    <rect x="-4" y="-2.5" width="8" height="5" rx="1" fill="#1a1a1a" stroke="white" stroke-width="1" />
  </g>
>

</svg>