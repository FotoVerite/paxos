<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1a5c96" stroke-width="0.5"/>
    </pattern>
    
    <pattern id="diagonalHatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="white" stroke-width="0.5" opacity="0.6" />
    </pattern>

    <mask id="rightBraceMask">
       <path d="M 65 25 C 75 25, 72 38, 72 45 C 72 48, 82 50, 82 50 C 82 50, 72 52, 72 55 C 72 62, 75 75, 65 75" 
             fill="white" />
    </mask>
  </defs>



  <path d="M 35 25 C 25 25, 28 38, 28 45 C 28 48, 18 50, 18 50 C 18 50, 28 52, 28 55 C 28 62, 25 75, 35 75" 
        fill="none" stroke="white" stroke-width="1" stroke-dasharray="2,1" opacity="0.4" />

  <rect x="65" y="25" width="20" height="50" fill="url(#diagonalHatch)" mask="url(#rightBraceMask)" />
  
  <path d="M 65 25 C 75 25, 72 38, 72 45 C 72 48, 82 50, 82 50 C 82 50, 72 52, 72 55 C 72 62, 75 75, 65 75" 
        fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" />

</svg>