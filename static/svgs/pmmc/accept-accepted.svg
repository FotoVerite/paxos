<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="overlapHatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="white" stroke-width="0.5" opacity="0.3" />
    </pattern>

    <mask id="blockClear">
      <rect width="100" height="100" fill="white" />
      <rect x="38" y="38" width="24" height="24" fill="black" />
    </mask>
  </defs>

  <g mask="url(#blockClear)">
    <circle cx="42" cy="50" r="25" fill="none" stroke="white" stroke-width="2" />
    
    <circle cx="58" cy="50" r="25" fill="url(#overlapHatch)" stroke="white" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <g>
    <rect x="38" y="38" width="24" height="24" fill="#1a1a1a" stroke="#ffcc00" stroke-width="1" />
    
    <g stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round">
      <line x1="44" y1="46" x2="56" y2="46" />
      <line x1="44" y1="54" x2="56" y2="54" />
    </g>
  </g>

  <circle cx="38" cy="50" r="1.5" fill="#ffcc00" />
  <circle cx="62" cy="50" r="1.5" fill="#ffcc00" />

  <line x1="15" y1="50" x2="85" y2="50" stroke="white" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.4" />
</svg>