<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="nvmHatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="white" stroke-width="1" opacity="0.3"/>
    </pattern>
    
    <clipPath id="quorumOverlap">
      <circle cx="58" cy="50" r="15" />
    </clipPath>
  </defs>

  <rect x="10" y="15" width="80" height="70" fill="none" stroke="white" stroke-width="1" stroke-dasharray="4 2" opacity="0.3" />

  <rect x="20" y="25" width="60" height="50" fill="url(#nvmHatch)" stroke="white" stroke-width="2" />
  
  <g transform="translate(0, 0)">
    <circle cx="42" cy="50" r="15" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="2 1" opacity="0.7" />
    <circle cx="58" cy="50" r="15" fill="none" stroke="white" stroke-width="1.5" />
    
    <circle cx="42" cy="50" r="15" fill="#ffcc00" clip-path="url(#quorumOverlap)" />
  </g>

  <g stroke="#ffcc00" stroke-width="2" fill="none">
    <path d="M 20 35 V 25 H 30" /> <path d="M 70 75 H 80 V 65" /> </g>
</svg>