    <circle cx="45" cy="0" r="2" fill="#ffcc00" />
  </g>

  <path d="M 50 25 L 90 50 L 50 75" fill="none" stroke="#ffcc00" stroke-width="1" stroke-dasharray="1,1" opacity="0.8" />
</svg>