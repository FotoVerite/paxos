      <line x1="0" y1="0" x2="0" y2="3" stroke="white" stroke-width="0.5" opacity="0.5" />
    </pattern>
  </defs>

  <line x1="20" y1="20" x2="20" y2="80" stroke="white" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6" />

