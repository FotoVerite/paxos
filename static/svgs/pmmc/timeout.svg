<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lambdaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(35, 35) scale(0.3)">
    <circle cx="50" cy="45" r="45" fill="url(#lambdaGlow)" />
    <path d="M 50 15 L 80 25 V 50 Q 80 75 50 85 Q 20 75 20 50 V 25 Z" 
          fill="none" 
          stroke="white" 
          stroke-width="4" />
    <text x="50" y="55" fill="white" font-size="28" text-anchor="middle" font-family="monospace">λ</text>
  </g>

  <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.3" />
  
  <path d="M 50 15 A 35 35 0 0 1 85 50" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="4 2" />


  <path d="M 50 85 A 35 35 0 0 1 15 50" fill="none" stroke="white" stroke-width="2" opacity="0.6" />


  <g transform="translate(50, 50)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#ffcc00" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="45" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="0" cy="-30" r="1" fill="#ffcc00" />
  </g>

  <path d="M 20 20 L 30 30" stroke="white" stroke-width="0.5" opacity="0.4" marker-end="url(#arrow)" />
</svg>