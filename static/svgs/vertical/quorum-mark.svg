<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <pattern id="vpQuorumGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" stroke="#6F6557" stroke-opacity=".12" stroke-width=".5"/>
    </pattern>
    <pattern id="vpQuorumHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3D5D92" stroke-opacity=".18" stroke-width=".7"/>
    </pattern>
    <radialGradient id="vpQuorumReadWash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(86 120) rotate(90) scale(56)">
      <stop stop-color="#5E87C6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5E87C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vpQuorumWriteWash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(154 120) rotate(90) scale(56)">
      <stop stop-color="#9C553D" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9C553D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="vpQuorumOverlapClip">
      <circle cx="154" cy="120" r="54"/>
    </clipPath>
    <filter id="vpQuorumGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="237" height="237" rx="18" fill="#fffaf3" fill-opacity=".62" stroke="#6F6557" stroke-opacity=".2"/>
  <rect x="12" y="12" width="216" height="216" rx="14" fill="url(#vpQuorumGrid)" opacity=".66"/>

  <g opacity=".72">
    <path d="M40 56H200" stroke="#6F6557" stroke-opacity=".18" stroke-width="1"/>
    <path d="M40 184H200" stroke="#6F6557" stroke-opacity=".18" stroke-width="1"/>
    <path d="M120 40V200" stroke="#6F6557" stroke-opacity=".16" stroke-width="1"/>
    <path d="M52 120H188" stroke="#6F6557" stroke-opacity=".18" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M86 48V58M86 182V192M154 48V58M154 182V192" stroke="#6F6557" stroke-opacity=".34" stroke-width="1.1"/>
  </g>

  <circle cx="86" cy="120" r="54" fill="url(#vpQuorumReadWash)"/>
  <circle cx="154" cy="120" r="54" fill="url(#vpQuorumWriteWash)"/>

  <circle cx="86" cy="120" r="54" stroke="#4F78BA" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>
  <circle cx="154" cy="120" r="54" stroke="#8E523D" stroke-width="3.2"/>

  <circle cx="86" cy="120" r="40" stroke="#4F78BA" stroke-opacity=".26" stroke-width="1.4" stroke-dasharray="2 5"/>
  <circle cx="154" cy="120" r="40" stroke="#8E523D" stroke-opacity=".2" stroke-width="1.2"/>

  <circle cx="86" cy="120" r="54" clip-path="url(#vpQuorumOverlapClip)" fill="url(#vpQuorumHatch)" opacity=".72"/>
  <circle cx="120" cy="120" r="18" fill="#F4E8D5" stroke="#6F6557" stroke-opacity=".34" stroke-width="1.4"/>
  <circle cx="120" cy="120" r="10" fill="none" stroke="#6F6557" stroke-opacity=".28" stroke-width="1"/>
  <path d="M120 102V138" stroke="#6F6557" stroke-opacity=".38" stroke-width="1.4"/>
  <path d="M110 120H130" stroke="#6F6557" stroke-opacity=".24" stroke-width="1"/>

  <path d="M72 86c6-4 11-5 18-5" stroke="#4F78BA" stroke-opacity=".58" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M80 79l6 2-4 5" stroke="#4F78BA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M168 154c-6 4-11 5-18 5" stroke="#8E523D" stroke-opacity=".62" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M160 161l-6-2 4-5" stroke="#8E523D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="120" cy="120" r="3.5" fill="#9C553D" filter="url(#vpQuorumGlow)" opacity=".55"/>
</svg>
