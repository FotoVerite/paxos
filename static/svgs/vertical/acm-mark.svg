<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Technical Grid Pattern -->
<pattern height="4" id="amcGrid" patternunits="userSpaceOnUse" width="4">
<path d="M4 0H0V4" stroke="#6F6557" stroke-opacity=".1" stroke-width=".3"></path>
</pattern>
<!-- Subtle Glow for the active node -->
<filter height="200%" id="activeGlow" width="200%" x="-50%" y="-50%">
<fegaussianblur stddeviation="0.6"></fegaussianblur>
</filter>
</defs>
<!-- Background Paper & Grid -->
<rect fill="#fffaf3" fill-opacity=".65" height="96" rx="8" stroke="#6F6557" stroke-opacity=".15" stroke-width="0.8" width="96" x="2" y="2"></rect>
<rect fill="url(#amcGrid)" height="88" opacity=".7" rx="6" width="88" x="6" y="6"></rect>
<!-- Structural Guidelines -->
<g opacity=".1">
<path d="M20 50H80" stroke="#6F6557" stroke-width="0.4"></path>
<path d="M50 20V80" stroke="#6F6557" stroke-width="0.4"></path>
</g>
<!-- Pending Member State (Top) - Centered -->
<g transform="translate(30 14)">
<rect fill="#F8F1E4" height="18" rx="4" stroke="#6F6557" stroke-opacity=".3" stroke-width="0.8" width="40"></rect>
<rect fill="#F3E7D3" height="3" opacity=".6" rx="1.5" width="20" x="10" y="3.5"></rect>
<!-- The "New Member" node being prepped -->
<g transform="translate(20 10)">
<circle fill="#fffaf3" r="4.5" stroke="#B26C50" stroke-dasharray="1.5 1" stroke-width="0.7"></circle>
<path d="M0 -2.5 l.6 1.4 1.5.2 -1.1.9 .3 1.5 -1.3 -.7 -1.3 .7 .3 -1.5 -1.1 -.9 1.5 -.2 Z" fill="#B26C50" fill-opacity=".4" transform="scale(0.7)"></path>
</g>
</g>
<!-- Transition Pathway -->
<g>
<!-- Vertical path from pending to slot -->
<path d="M50 32 V47" stroke="#B26C50" stroke-dasharray="2 2" stroke-opacity=".6" stroke-width="0.8"></path>
<!-- Hand-drawn arrow at bottom of vertical path - precise spacing -->
<path d="M48 45.5 l2 2.5 2-2.5" fill="none" stroke="#B26C50" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".8" stroke-width="0.8"></path>
</g>
<!-- Active Registry / Membership Row (Perfectly Centered) -->
<g transform="translate(50 62)">
<!-- Main Container Disk -->
<circle fill="#F3E7D3" fill-opacity=".4" r="24" stroke="#6F6557" stroke-opacity=".15" stroke-width="0.6"></circle>
<!-- Equilateral Node System Structure -->
<g>
<!-- Connecting Lines of the equilateral triangle -->
<path d="M-11 7 L11 7 L0 -10.5 Z" fill="none" stroke="#6F6557" stroke-opacity=".15" stroke-width="0.5"></path>
<!-- Supporting Member Left -->
<circle cx="-11" cy="7" fill="#6F6557" fill-opacity=".15" r="3.5"></circle>
<!-- Supporting Member Right -->
<circle cx="11" cy="7" fill="#6F6557" fill-opacity=".15" r="3.5"></circle>
<!-- The Primary Slotted Member Node (Top of Triangle) -->
<g transform="translate(0 -10.5)">
<circle fill="#fffaf3" r="6.5" stroke="#587BB5" stroke-width="1.2"></circle>
<!-- Tiny Star Node -->
<path d="M0 -3 l.7 1.7 1.8.2 -1.3 1.1 .4 1.8 -1.6 -.9 -1.6 .9 .4 -1.8 -1.3 -1.1 1.8 -.2 Z" fill="#587BB5" fill-opacity=".9" transform="scale(0.8)"></path>
<!-- Core Connection Point -->
<circle fill="#B26C50" filter="url(#activeGlow)" opacity=".3" r="1"></circle>
</g>
</g>
</g>
<!-- Technical Legend/Accent (Bottom Corner) -->
<g opacity=".15" transform="translate(12 84)">
<rect fill="#6F6557" height="1" rx="0.5" width="14"></rect>
<rect fill="#6F6557" height="1" rx="0.5" width="8" y="3"></rect>
</g>
</svg>