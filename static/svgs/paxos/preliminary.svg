<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF71CE"/>
      <stop offset="100%" stop-color="#01CDFE"/>
    </linearGradient>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF71CE"/>
      <stop offset="100%" stop-color="#01CDFE"/>
    </linearGradient>
    <g id="pillar">
      <rect x="0" y="65" width="20" height="3" rx="0.5" fill="url(#mathGrad)"/>
      <rect x="4" y="30" width="3" height="35" fill="url(#mathGrad)" opacity="0.6"/>
      <rect x="8.5" y="30" width="3" height="35" fill="url(#mathGrad)"/>
      <rect x="13" y="30" width="3" height="35" fill="url(#mathGrad)" opacity="0.6"/>
      <rect x="2" y="27" width="16" height="3" rx="0.5" fill="url(#mathGrad)"/>
    </g>
    <g id="beacon">
      <circle cx="50" cy="20" r="4" fill="url(#lineGrad)"/>
       <circle cx="50" cy="20" r="8" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" stroke-dasharray="3 2" stroke-opacity="0.5"/>
      <circle cx="50" cy="20" r="12" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" stroke-dasharray="3 2" stroke-opacity="0.5"/>
    </g>
  </defs>
  <use href="#beacon" x="0" y="8"/>
  <use href="#pillar" x="40" y="20"/>
</svg>
