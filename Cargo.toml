[package]
name = "paxos"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
rand = { version = "0.9.2" }
axum = { version = "0.7.5", features = ["ws"] }
tower-http = { version = "0.5.2", features = ["fs"] }
serde_json = "1.0.128"
colored = "2.1.0"
