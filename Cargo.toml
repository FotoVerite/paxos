[package]
name = "paxos"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = "0.7"

rand = { version = "0.9.2" }
axum = { version = "0.7.5", features = ["ws"] }
tower-http = { version = "0.5.2", features = ["fs"] }
serde_json = "1.0.128"
async-trait = "0.1"
colored = "2.1.0"
tera = "1"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.19.0", features = ["v4", "v5", "std", "serde"] }
derive_more = { version = "2.1.1", features = ["full"] }

[features]
default = ["persistence"]
persistence = []  # Enable durability features (disabled in tests by default)
pmmc = []
